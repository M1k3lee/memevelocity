name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PAGES_ARTIFACT_NAME: github-pages

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /memevelocity
        continue-on-error: false
      
      - name: Check build output
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found after build"
            exit 1
          fi
          # Create .nojekyll to ensure folders starting with _ are served
          touch out/.nojekyll
          echo "Build output found:"
          ls -la out/ | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      pages: write
      id-token: write
    steps:
      - name: Remove duplicate Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          artifact_name = os.environ["PAGES_ARTIFACT_NAME"]
          owner, repo = repository.split("/", 1)
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-actions",
          }

          def request(url: str, method: str = "GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  if method == "GET":
                      return json.loads(response.read().decode())
                  response.read()
                  return None

          artifacts_url = f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          artifacts = request(artifacts_url)["artifacts"]
          matches = [artifact for artifact in artifacts if artifact["name"] == artifact_name and not artifact.get("expired", False)]
          matches.sort(key=lambda artifact: (artifact["created_at"], artifact["id"]))

          if len(matches) <= 1:
              print(f"Found {len(matches)} Pages artifact(s); nothing to delete.")
          else:
              keep = matches[-1]
              print(f"Keeping artifact {keep['id']} and deleting {len(matches) - 1} duplicate(s).")
              for artifact in matches[:-1]:
                  delete_url = f"https://api.github.com/repos/{owner}/{repo}/actions/artifacts/{artifact['id']}"
                  request(delete_url, "DELETE")
                  print(f"Deleted duplicate artifact {artifact['id']}.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

